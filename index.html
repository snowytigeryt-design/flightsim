<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First Person Jet Simulator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="hud">
        <div id="speed-tape" class="hud-box">SPD <br><span id="speed-val">0</span></div>

        <div id="center-reticle">
            <div id="crosshair"></div>
            <div id="pitch-ladder"></div>
        </div>

        <div id="alt-tape" class="hud-box">ALT <br><span id="alt-val">0</span></div>

        <div id="crash-msg">SYSTEM FAILURE<br>CRASH DETECTED</div>
        <div id="stall-msg">ENGINE STALL<br>ALTITUDE LIMIT REACHED</div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="app.js"></script>
</body>
</html>
